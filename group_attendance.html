<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Attendance</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      background: #d3d3d3;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px;
    }

    h2 {
      margin: 12px 0;
      font-size: 18px;
      text-decoration: underline;
      text-align: center;
    }

    .button-container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 20px 0;
    }

    .group-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      background: #ffc107;
      color: #000;
      cursor: pointer;
    }

    .group-btn:active {
      transform: scale(0.96);
      background: #e0a800;
    }

    #shayari {
      font-size: 15px;
      color: #333;
      margin-top: 16px;
      max-width: 360px;
      line-height: 1.6;
      border: 1.5px solid #bbb;
      padding: 16px;
      background: #f2f2f2;
      border-radius: 10px;
      text-align: center;
    }

    @media (max-width: 360px) {
      h2 {
        font-size: 16px;
      }
      .group-btn {
        font-size: 14px;
        padding: 12px;
      }
      #shayari {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <h2>❤️ B Pharmacy – 6th Sem (3rd Year) ❤️</h2>

  <div class="button-container">
    <button class="group-btn" onclick="location.href='A.html'">Group A</button>
    <button class="group-btn" onclick="location.href='B.html'">Group B</button>
    <button class="group-btn" onclick="location.href='C.html'">Group C</button>
    <button class="group-btn" onclick="location.href='D.html'">Group D</button>
  </div>

  <h2>❤️ Enjoy ❤️</h2>
  <div id="shayari">Loading Shayari...</div>

  <script>
    const shayariList = [
      "Zindagi ek safar hai suhana, yahaan kal kya ho kisne jaana.",
      "Mohabbat bhi zindagi ki tarah hoti hai, har mod aasan nahi hota.",
      "Safar khubsoorat hai manzil se bhi, bas chalte rehne ka hosla chahiye.",
      "Har khushi ka raaz mohabbat hai, aur har gham ka ilaj waqt hai.",
      "Aansoon chhupane ki aadat hai mujhe, khushi me bhi muskuraane ki aadat hai mujhe.",
      "Chalte rahein toh raaste mil hi jaate hain, ruke toh mitti bhi saath chhod jaati hai.",
      "Rishta woh nahi jisme roz baat ho, rishta woh hai jisme har baat me yaad ho.",
      "Mohabbat sirf ek ahsaas nahi, balki zindagi jeene ka andaz hai.",
      "Dil se dua karo toh har dua puri hoti hai.",
      "Chup rehne wale log aksar pyaar zyada karte hain."
    ];

    function updateShayari() {
      const randomIndex = Math.floor(Math.random() * shayariList.length);
      document.getElementById("shayari").innerText = shayariList[randomIndex];
    }

    updateShayari();
    setInterval(updateShayari, 180000); // every 3 minutes
  </script>

</body>
</html>
