<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B Pharmacy – 6th Sem</title>

  <!-- Preload images -->
  <link rel="preload" as="image" href="pic/1.jpg">
  <link rel="preload" as="image" href="pic/2.png">

  <style>
    :root {
      --primary: #6a11cb;
      --secondary: #2575fc;
      --glass: rgba(255, 255, 255, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      padding: 12px;
    }

    h2 {
      margin-bottom: 14px;
      font-weight: 600;
      font-size: 18px;
      text-align: center;
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      text-align: center;
    }

    img {
      width: 100%;
      border-radius: 12px;
      margin: 10px 0;
      object-fit: cover;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    button {
      padding: 13px;
      font-size: 15px;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      transition: transform 0.15s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    #regular-attendance {
      background: #00c853;
    }

    #group-attendance {
      background: #2979ff;
    }

    a {
      display: inline-block;
      margin-top: 12px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      opacity: 0.9;
    }

    a:active {
      opacity: 1;
    }

    /* Extra small phones */
    @media (max-width: 360px) {
      h2 {
        font-size: 16px;
      }
      button {
        font-size: 14px;
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>❤️ B Pharmacy – 6th Sem (3rd Year) ❤️</h2>

    <img src="pic/1.jpg" alt="B Pharmacy" loading="eager">

    <div class="button-container">
      <button id="regular-attendance" onclick="location.href='ass.html'">
        Regular Attendance
      </button>

      <button id="group-attendance" onclick="location.href='group_attendance.html'">
        Group Attendance
      </button>
    </div>

    <img src="pic/2.png" alt="Footer" loading="lazy">

    <a href="instagram://user?username=l_ma_lik_l"
       onclick="setTimeout(() => location.href='https://www.instagram.com/l_ma_lik_l', 600)">
      ❤️ Ma Lik ❤️
    </a>
  </div>
</body>
</html>
